[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-mm"
version = "0.3.0"
description = "Search, reconstruct, exactly verify, and report finite bilinear algorithms for matrix multiplication."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fast-mm = "fast_mm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
